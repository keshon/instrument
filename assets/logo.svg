<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 103 22" width="103" height="22"
     role="img" aria-label="instrument UI">
  <title>instrument UI</title>

  <!-- «i» нарисована стойкой и точкой: только так её точку можно покрасить
       акцентом, не завися от метрик шрифта. Посадка отмерена по шрифту —
       ширина «i» 4.44, стойка 1.9, боковые просветы по 1.27. -->
  <rect x="1.27" y="9" width="1.9" height="9" rx="0.95" fill="#161513"/>
  <circle cx="2.22" cy="6.7" r="1.7" fill="#0a77cb"/>

  <!-- В экспортированном файле цвета захардкожены намеренно: он живёт вне
       кита, где токенов нет. -->
  <text x="4.44" y="18" fill="#161513" font-size="17" font-weight="500" letter-spacing="-0.17"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  >nstrument</text>
  <text x="89.2" y="18" fill="#84817e" font-size="13" font-weight="500"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  >UI</text>
</svg>
