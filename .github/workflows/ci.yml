# Проверки на каждый push и каждый PR.
#
# Все четыре уже существовали и запускались руками — и этого не хватало: за
# одну сессию аудита трижды всплывала регрессия, которую поймал только ручной
# прогон. Проверка, которую надо не забыть запустить, однажды не запустится.
#
# Порядок — по стоимости: сначала то, что считает числа, потом то, что читает
# документацию, и последней сборка, которая тяжелее всех и включает в себя
# проверку ссылок, спрайта и пустых кадров.

name: проверки

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            tools/go.sum
            site/go.sum

      # Контраст токенов против порогов WCAG. Читает настоящий tokens.css и
      # резолвит var(), light-dark() и color-mix() так же, как браузер.
      - name: контраст
        run: go -C tools run ./cmd/contrast

      # Цели нажатия против WCAG 2.2 AA по всем трём плотностям.
      - name: цели нажатия
        run: go -C tools run ./cmd/targets

      # Документация против кита, в обе стороны: выдуманный класс, выдуманный
      # токен, значение вне словаря, класс без страницы.
      - name: документация против кита
        run: go -C tools run ./cmd/docscheck

      # Сборка сайта. Роняет себя сама на битой ссылке, неразвёрнутой ограде,
      # отсутствующем символе спрайта и пустом кадре примера.
      - name: сборка сайта
        run: go -C site run ./cmd/site

      - name: go vet
        run: |
          go -C tools vet ./...
          go -C site vet ./...

      # Форматирование. gofmt молчит, когда всё ровно, и печатает список
      # файлов, когда нет, — поэтому проверяется именно пустота вывода.
      - name: gofmt
        run: |
          out=$(gofmt -l tools site)
          if [ -n "$out" ]; then
            echo "не отформатировано:"
            echo "$out"
            exit 1
          fi
