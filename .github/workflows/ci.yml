# Проверки на каждый push и каждый PR.
#
# Все четыре уже существовали и запускались руками — и этого не хватало: за
# одну сессию аудита трижды всплывала регрессия, которую поймал только ручной
# прогон. Проверка, которую надо не забыть запустить, однажды не запустится.
#
# Порядок — по стоимости: сначала то, что считает числа, потом то, что читает
# документацию, и последней сборка, которая тяжелее всех и включает в себя
# проверку ссылок, спрайта и пустых кадров.

name: проверки

on:
  push:
  pull_request:

# Публикация требует прав; проверкам они не нужны, поэтому объявлены здесь, а
# работа `pages` берёт только их.
permissions:
  contents: read
  pages: write
  id-token: write

# Два деплоя одновременно затирают друг друга. Отменять начатый нельзя:
# отменённая публикация оставляет сайт в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            tools/go.sum
            site/go.sum

      # Контраст токенов против порогов WCAG. Читает настоящий tokens.css и
      # резолвит var(), light-dark() и color-mix() так же, как браузер.
      - name: контраст
        run: go -C tools run ./cmd/contrast

      # Цели нажатия против WCAG 2.2 AA по всем трём плотностям.
      - name: цели нажатия
        run: go -C tools run ./cmd/targets

      # Отношения размеров: лестница кеглей, форма контрола, чётность радиусов,
      # ритм — по всем пятнадцати ячейкам масштаба и плотности. Сторожит весь
      # ярус ролей и до сих пор запускался только руками, хотя CONTRIBUTING
      # обещал обратное. Проверка, которую надо не забыть запустить, однажды не
      # запустится — и тогда её зелёный цвет ничего не значит.
      - name: пропорции
        run: go -C tools run ./cmd/proportion

      # Документация против кита, в обе стороны: выдуманный класс, выдуманный
      # токен, значение вне словаря, класс без страницы.
      - name: документация против кита
        run: go -C tools run ./cmd/docscheck

      # Собранное не может отстать от исходника молча: это единственная
      # разновидность расхождения, которую невозможно заметить глазами —
      # страница выглядит правильной, потому что смотрят на src.
      - name: dist не отстал от src
        run: go -C tools run ./cmd/dist -check

      # Сборка сайта. Роняет себя сама на битой ссылке, неразвёрнутой ограде,
      # отсутствующем символе спрайта и пустом кадре примера.
      - name: сборка сайта
        run: go -C site run ./cmd/site

      - name: go vet
        run: |
          go -C tools vet ./...
          go -C site vet ./...

      # Форматирование. gofmt молчит, когда всё ровно, и печатает список
      # файлов, когда нет, — поэтому проверяется именно пустота вывода.
      - name: gofmt
        run: |
          out=$(gofmt -l tools site)
          if [ -n "$out" ]; then
            echo "не отформатировано:"
            echo "$out"
            exit 1
          fi

  # Публикация сайта.
  #
  # Отдельная работа, а не шаг: она обязана ЗАВИСЕТЬ от проверок. Сборка сайта
  # уже стоит среди них и роняет себя на битой ссылке, отсутствующем символе
  # спрайта и пустом кадре примера — но публиковать нельзя и при красном
  # контрасте, и при разошедшемся dist. `needs` это и означает.
  #
  # Только с ветки по умолчанию: справочник описывает то, что лежит в dist, и
  # ветка с наполовину переписанным компонентом не должна становиться сайтом.
  pages:
    needs: check
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
          cache-dependency-path: site/go.sum

      # Тот же вызов, что и локально: домен приезжает из site/public/CNAME,
      # а не дописывается здесь. Собранное локально и опубликованное — один
      # и тот же каталог.
      - name: сборка сайта
        run: go -C site run ./cmd/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
