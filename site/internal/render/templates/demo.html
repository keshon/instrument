<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пример — {{ .Title }}</title>
<!-- Кит подключается ровно так же, как у потребителя: одной строкой.
     Ничего от справочника здесь нет — это чужой экран. -->
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/demo.css">
<script>
  /* Тема ставится до отрисовки, иначе кадр успевает мигнуть. Приходит от
     родителя через ?theme=, потому что iframe не видит его localStorage. */
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
    if (q.get('density')) document.documentElement.dataset.density = q.get('density');
  } catch (e) {}
</script>
</head>
<body>
{{ .Sprite }}
<div class="demo-root">{{ .Markup }}</div>
<script src="/demo.js" defer></script>
</body>
</html>
